# IDF Component Manager Manifest File
# See https://docs.espressif.com/projects/idf-component-manager/en/latest/reference/manifest_file.html

dependencies:
  idf: '>=4.4'

  knob: ^1.0.0
  pcap: ^1.0.2
  iperf: ^1.0.3
  quirc: ^1.2.0
  qrcode: ^0.2.0
  button: ^4.2.0
  elf_loader: ^1.3.2
  esp_new_jpeg: ^1.0.2
  esp32-camera: ^2.1.7
  esp_delta_ota: ^1.1.2
  led_indicator: ^2.1.2

  mdns:
    version: ^1.11.3
    rules:
    - if: idf_version >=5.0

  joltwallet/littlefs:
    version: ^1.22.3
    rules:
    - if: idf_version >=5.0

  lvgl/lvgl: ^8
  esp_lvgl_port:
    matches:
    - if: idf_version <5.0
      version: =2.6.0
    - if: idf_version >=5.0
      version: ^2.8.0

  esp_tinyusb:
    version: ^1.7.6
    rules:
    - if: idf_version >=5.0
    - if: target in [esp32s2, esp32s3]
  usb_host_cdc_acm:
    version: ^2.4.0
    rules:
    - if: idf_version >=5.0
    - if: target in [esp32s2, esp32s3]
  usb_host_msc:
    version: ^1.2.0
    rules:
    - if: idf_version >=5.0
    - if: target in [esp32s2, esp32s3]
  usb_host_hid:
    version: ^1.2.0
    rules:
    - if: idf_version >=5.0
    - if: target in [esp32s2, esp32s3]

  usb:
    rules:
    - if: idf_version >=6.0
    - if: target in [esp32s2, esp32s3]
  mqtt:
    rules:
    - if: idf_version >=6.0
  cjson:
    rules:
    - if: idf_version >=6.0
  touch_element:
    rules:
    - if: idf_version >=6.0
    - if: target in [esp32s2, esp32s3]
